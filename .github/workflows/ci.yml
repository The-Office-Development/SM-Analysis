name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (app)
        run: npx tsc -b --noEmit
      - name: Typecheck (functions)
        run: npx tsc -p tsconfig.functions.json
      # VITE_ vars are inlined by Vite AT BUILD TIME. A build without them
      # succeeds and produces a site that cannot reach Supabase at all: the sign
      # in form renders and then refuses every attempt. That is exactly what
      # shipped once, because the first CI build had none of them and nothing
      # downstream noticed.
      #
      # They are not secrets in the cryptographic sense — Vite writes them into
      # the browser bundle, so every visitor has them. They live in repository
      # secrets for tidiness, not confidentiality.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      # The guard that would have caught it.
      #
      # A missing environment variable does not fail a Vite build; it silently
      # inlines `undefined` and the defect only appears when a human tries to log
      # in. Demo mode keeps working, so a smoke test of the dashboard passes
      # while the product is unusable for every real client.
      #
      # This asserts the built bundle actually contains a Supabase project URL
      # and a publishable key, and fails the run when it does not, so a build
      # that cannot sign anyone in never reaches the deploy job.
      - name: The build must be able to reach Supabase
        run: |
          BUNDLE=$(ls dist/assets/index-*.js | head -1)
          if ! grep -q 'supabase\.co' "$BUNDLE"; then
            echo "::error::No Supabase URL in $BUNDLE — VITE_SUPABASE_URL was missing at build time."
            exit 1
          fi
          if ! grep -qE 'sb_publishable_|eyJhbGciOi' "$BUNDLE"; then
            echo "::error::No Supabase key in $BUNDLE — VITE_SUPABASE_ANON_KEY was missing at build time."
            exit 1
          fi
          echo "Supabase configuration is present in $BUNDLE."

      - name: Tests
        run: bash verify/run-tests.sh
      # Kept for the deploy job below, so the site is built exactly once, by the
      # same run that proved it works. Rebuilding in the deploy job would deploy
      # an artifact nothing had tested.
      - name: Keep the build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Deploy.
  #
  # WHY THIS EXISTS RATHER THAN CLOUDFLARE'S OWN GIT INTEGRATION
  #
  # Pages projects come in two kinds and the kind is fixed when the project is
  # created. A Git-connected project watches the repository and builds on push.
  # A Direct Upload project has no idea the repository exists; it only changes
  # when somebody uploads a built folder to it.
  #
  # `pulseboard` is Direct Upload, created by `wrangler pages deploy` during the
  # move off Netlify rather than through the Connect to Git flow. Cloudflare's
  # documentation is explicit that this cannot be undone: "If you choose Direct
  # Upload, you cannot switch to Git integration later." Converting means a new
  # project and moving app.theoffice.it.com onto it.
  #
  # This closes the gap without that surgery, and ends up better than the
  # integration would have been: Cloudflare's own builds deploy whatever is on
  # main, passing or failing, whereas this job runs only after the typechecks,
  # the 119 assertions and the mutation gate have passed. A red build never
  # reaches a client.
  #
  # HOW IT WENT UNNOTICED FOR THIRTEEN COMMITS
  #
  # Wrangler stamps the local git branch and commit onto a Direct Upload, so the
  # dashboard listed "main" and a real commit hash beside deployments that had
  # nothing to do with GitHub. It looked exactly like a connected project. The
  # only visible difference was `Git Provider: No` in the project list.
  #
  # SECRETS (set once, in the repository's Settings -> Secrets -> Actions)
  #   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
  #   CLOUDFLARE_ACCOUNT_ID  — 69b37cce7d7633d2e73be9b548b8021a
  #
  # Until both exist this job is skipped rather than failed, so adding the file
  # ahead of the secrets does not turn CI red.
  # ---------------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dependencies are needed even though the site is already built.
      #
      # `wrangler pages deploy` uploads dist AND bundles the Pages Functions in
      # functions/, which import through to netlify/functions and from there to
      # @anthropic-ai/sdk and @supabase/supabase-js. Without node_modules the
      # bundler cannot resolve them and the deploy fails with "Could not resolve
      # @anthropic-ai/sdk" — while the static half looks perfectly fine.
      #
      # This never showed up in a manual deploy because a developer's machine
      # always has node_modules already.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Are the credentials present?
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so this push was not deployed."
          fi

      - name: Take the build that passed the tests
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --commit-dirty is not passed: the checkout is clean, and the commit
        # this deployment records should be the one that was actually tested.
        run: npx wrangler@4 pages deploy dist --project-name pulseboard --branch main
