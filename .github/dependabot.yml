# Meta DPA 3.1-17.a asks for a defined patching process for the backend.
#
# Weekly, grouped: one PR for npm minor/patch updates and one for Actions, each
# of which must pass CI (typecheck, the suite, the mutation gate) before it can
# merge. The first run without grouping opened nine PRs at once, five of them
# major-version jumps (Vite 5 to 8, date-fns 3 to 4, @netlify/functions 2 to 6).
#
# Major versions are NOT proposed weekly: each is a migration to plan, not a
# patch. SECURITY updates are unaffected by this ignore rule; Dependabot raises
# those regardless (repo setting: Dependabot security updates).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
