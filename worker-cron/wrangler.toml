# The scheduled sync. Deployed separately from the Pages project because Pages
# Functions cannot carry a Cron Trigger.
#
#   cd worker-cron && npx wrangler deploy
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put TOKEN_ENC_KEY
#   npx wrangler secret put INSTAGRAM_APP_SECRET
#   npx wrangler secret put META_APP_SECRET
#   npx wrangler secret put VITE_SUPABASE_URL
#
# No route and no fetch handler: this Worker is reachable only by its schedule.
# It holds the service-role key, so that is deliberate — see index.ts.

name = "pulseboard-cron"
main = "index.ts"

# No workers.dev URL. This Worker holds the service-role key and TOKEN_ENC_KEY
# and has no fetch handler, so a public hostname serves no purpose and only
# widens what can be probed. The schedule is the only intended way in, and the
# comment in index.ts claims exactly that — this is what makes the claim true.
workers_dev = false
compatibility_date = "2026-09-01"

# Redundant at this compatibility date — 2026-08-04 and later enable both
# nodejs_compat and nodejs_compat_v2 by default — but stated explicitly so the
# dependency is visible. node:crypto does the token encryption, and the
# Anthropic SDK reaches for node:path. Neither should rely on a default that a
# future date change could quietly move.
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every 15 minutes. The body stops early on its budget and the trailing re-fetch
# in _sync.ts heals any missed run, so the cadence is a floor on freshness rather
# than a guarantee of completeness. (Until 2026-09-12 this paragraph began
# "Hourly, matching the Netlify schedule it replaces", directly above a line
# saying the opposite. sync_log that day recorded 39 runs per account in 24
# hours, not the 96 this schedule implies — observed, not yet explained.)
#
# The per-run subrequest cap and the daily request budget are different limits,
# and only the first has ever constrained us. A cron firing is ONE request
# against 100,000 a day, and each firing gets its own fresh 50 subrequests — so
# running four times as often costs 96 requests a day instead of 24, and buys
# four times the work. Measured after a day of hourly syncing, Instagram's own
# x-app-usage reported call_volume 0, so there is headroom on that side too.
#
# The reason to spend it is stories. A story lives 24 hours and cannot be
# re-fetched once gone; hourly gave 24 chances to catch one, this gives 96. It
# also quarters the time a new account takes to backfill.
#
# What it does NOT fix: a single run still cannot finish. More trips, same size
# truck.
crons = ["*/15 * * * *", "0 */4 * * *"]
